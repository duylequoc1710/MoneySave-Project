<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon chính định dạng .ico & .png (16x16, 32x32) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b9e63" />
    <title>MoneySave – Quản lý tài chính cá nhân</title>
    <!-- Thiết lập theme đồng bộ ngay lập tức trước khi render, triệt tiêu hoàn toàn glitch / flash sáng tối khi mở trang -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('moneygo_theme');
          if (!t) {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
